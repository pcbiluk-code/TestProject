<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora de Rescisão CLT</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #f4f6f8; color: #222; margin: 0; padding: 16px; }
    main { max-width: 560px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    h1 { font-size: 1.4rem; margin-top: 0; }
    label { display: block; margin: 12px 0 4px; font-weight: 600; font-size: .9rem; }
    input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
    small { color: #666; }
    button { margin-top: 20px; width: 100%; padding: 12px; background: #1565c0; color: #fff; border: 0; border-radius: 6px; font-size: 1rem; cursor: pointer; }
    button:hover { background: #0d47a1; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    td { padding: 6px 4px; border-bottom: 1px solid #eee; }
    td:last-child { text-align: right; white-space: nowrap; }
    tr.total td { font-weight: 700; border-top: 2px solid #222; }
    .neg { color: #c62828; }
    .info { margin-top: 12px; font-size: .9rem; color: #444; }
    .erro { color: #c62828; margin-top: 12px; }
  </style>
</head>
<body>
<main>
  <h1>Calculadora de Rescisão CLT</h1>
  <form id="form">
    <label for="salario">Salário bruto mensal (R$)</label>
    <input id="salario" type="number" step="0.01" min="0" required value="3000">

    <label for="admissao">Data de admissão</label>
    <input id="admissao" type="date" required>

    <label for="saida">Data de saída (último dia trabalhado)</label>
    <input id="saida" type="date" required>

    <label for="tipo">Motivo da rescisão</label>
    <select id="tipo">
      <option value="sem_justa_causa">Demissão sem justa causa</option>
      <option value="pedido_demissao">Pedido de demissão</option>
      <option value="acordo">Acordo (art. 484-A)</option>
      <option value="justa_causa">Demissão por justa causa</option>
    </select>

    <label for="aviso">Aviso prévio</label>
    <select id="aviso">
      <option value="indenizado">Indenizado / não cumprido</option>
      <option value="trabalhado">Trabalhado / cumprido</option>
    </select>

    <label for="feriasVencidas">Períodos de férias vencidas (não tiradas)</label>
    <input id="feriasVencidas" type="number" min="0" max="2" value="0">

    <label for="saldoFgts">Saldo do FGTS (R$) <small>— opcional, se vazio é estimado</small></label>
    <input id="saldoFgts" type="number" step="0.01" min="0">

    <button type="submit">Calcular</button>
  </form>

  <div id="resultado"></div>
</main>

<script src="rescisao.js"></script>
<script>
  const brl = v => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  const $ = id => document.getElementById(id);

  $('form').addEventListener('submit', e => {
    e.preventDefault();
    const saldo = $('saldoFgts').value;
    try {
      const r = Rescisao.calcular({
        salario: Number($('salario').value),
        admissao: $('admissao').value,
        saida: $('saida').value,
        tipo: $('tipo').value,
        aviso: $('aviso').value,
        feriasVencidas: Number($('feriasVencidas').value),
        saldoFgts: saldo === '' ? null : Number(saldo),
      });
      const linhas = r.linhas.map(([nome, v]) =>
        `<tr><td>${nome}</td><td class="${v < 0 ? 'neg' : ''}">${brl(v)}</td></tr>`).join('');
      $('resultado').innerHTML = `
        <table>${linhas}<tr class="total"><td>Total bruto</td><td>${brl(r.total)}</td></tr></table>
        <div class="info">
          Tempo de casa: <b>${r.info.anosCompletos} ano(s) completo(s)</b><br>
          Saque do FGTS: <b>${r.info.saqueFgts}</b> (saldo ${brl(r.info.saldoFgts)})<br>
          Seguro-desemprego: <b>${r.info.seguroDesemprego ? 'tem direito*' : 'não'}</b><br>
          <small>* sujeito às regras de carência. Valores brutos estimados, sem descontos de INSS/IRRF.</small>
        </div>`;
    } catch (err) {
      $('resultado').innerHTML = `<p class="erro">${err.message}</p>`;
    }
  });
</script>
</body>
</html>
